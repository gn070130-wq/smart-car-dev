<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>UDP Monitor</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#202525;font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:22px;font-weight:600;margin:0 0 18px}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;border-top:1px solid #c9c5bc;border-bottom:1px solid #c9c5bc;padding:14px 0}.field{display:grid;gap:5px;color:#5d625f;font-size:12px}.field input{width:112px;padding:8px;border:1px solid #aaa79f;background:#fffefb;font:inherit}.field.ip input{width:145px}button{padding:9px 14px;border:1px solid #202525;background:#202525;color:white;cursor:pointer}button.alt{background:transparent;color:#202525}.status{margin:12px 0;color:#68716d}.channels{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0;color:#3f4745}.channels label{cursor:pointer;white-space:nowrap}.channels input{accent-color:#202525;margin-right:5px}.chart{background:#171c1d;min-height:460px;padding:10px;border:1px solid #303a3b}canvas{width:100%;height:440px;display:block}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.readout div{border-top:1px solid #c9c5bc;padding-top:8px;color:#68716d}.readout b{display:block;color:#202525;font-size:16px;margin-top:3px}@media(max-width:700px){main{padding:15px}.readout{grid-template-columns:1fr 1fr}}
</style></head><body><main><h1>下位机 UDP 监控</h1><section class="bar"><label class="field ip">下位机 IP<input id="robot" value="192.168.1.50"></label><label class="field">UDP 端口<input id="robot_port" value="9001" type="number"></label><button id="apply">应用地址</button><label class="field">left_expect_speed<input id="left_expect_speed" value="0" type="number"></label><label class="field">right_expect_speed<input id="right_expect_speed" value="0" type="number"></label><label class="field">wp<input id="wp" value="10" type="number" step="any"></label><label class="field">wi<input id="wi" value="2" type="number" step="any"></label><label class="field">wd<input id="wd" value="15" type="number" step="any"></label><button id="send">发送参数</button><button class="alt" id="pause">暂停绘图</button><button class="alt" id="clear">清空</button></section><div class="status" id="status">正在连接桥接服务…</div><div class="channels" id="channels"></div><section class="chart"><canvas id="chart"></canvas></section><section class="readout"><div>编码器 L/R<b id="enc">—</b></div><div>目标速度 L/R<b id="exp">—</b></div><div>PWM L/R<b id="pwm">—</b></div><div>wp<b id="rwp">—</b></div><div>wi<b id="rwi">—</b></div><div>wd<b id="rwd">—</b></div></section></main><script>
const defs=[['encoder_left','编码器 L','计数','#e86b63'],['encoder_right','编码器 R','计数','#63c5a5'],['left_expect_speed','目标速度 L','速度值','#dfae55'],['right_expect_speed','目标速度 R','速度值','#f0cc72'],['pwm_left','PWM L','PWM','#83a9d7'],['pwm_right','PWM R','PWM','#a9c7e8'],['wp','wp','比例系数','#c384c9'],['wi','wi','比例系数','#d6a2d8'],['wd','wd','比例系数','#efc5e8']],hist=Object.fromEntries(defs.map(d=>[d[0],[]]));let enabled=Object.fromEntries(defs.map(d=>[d[0],true])),paused=false,ws;
const $=id=>document.getElementById(id), status=$('status');
defs.forEach(([key,label,unit,color])=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked data-key="${key}"><span style="color:${color}">${label}</span>（${unit}）`;l.querySelector('input').onchange=e=>{enabled[key]=e.target.checked;draw()};$('channels').append(l)});
function connect(){ws=new WebSocket(`ws://${location.host}`);ws.onopen=()=>status.textContent='已连接桥接服务，等待下位机遥测';ws.onclose=()=>{status.textContent='桥接服务断开，正在重连…';setTimeout(connect,1500)};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='status'){status.textContent=d.message;return}if(!paused){defs.forEach(([n])=>{if(n in d){hist[n].push(d[n]);hist[n]=hist[n].slice(-300)}});draw()}$('enc').textContent=`${d.encoder_left} / ${d.encoder_right}`;$('exp').textContent=`${d.left_expect_speed} / ${d.right_expect_speed}`;$('pwm').textContent=`${d.pwm_left} / ${d.pwm_right}`;$('rwp').textContent=d.wp;$('rwi').textContent=d.wi;$('rwd').textContent=d.wd}}connect();
$('apply').onclick=()=>{if(!/^[\w:.%-]+$/.test($('robot').value)||!Number.isInteger(Number($('robot_port').value))){status.textContent='IP 或端口格式不正确';return}if(ws?.readyState===1){status.textContent='正在应用 UDP 目标…';ws.send(JSON.stringify({type:'set_target',host:$('robot').value,port:Number($('robot_port').value)}))}};$('send').onclick=()=>{const d={type:'set_parameters'};['left_expect_speed','right_expect_speed','wp','wi','wd'].forEach(n=>d[n]=Number($(n).value));if(ws?.readyState===1){status.textContent='正在发送参数…';ws.send(JSON.stringify(d))}else status.textContent='桥接服务尚未连接'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续绘图':'暂停绘图'};$('clear').onclick=()=>{defs.forEach(([n])=>hist[n]=[]);draw()};
function draw(){const c=$('chart'),r=c.getBoundingClientRect(),scale=devicePixelRatio||1;c.width=r.width*scale;c.height=r.height*scale;const x=c.getContext('2d');x.setTransform(scale,0,0,scale,0,0);const w=r.width,h=r.height,left=58,right=18,top=28,bottom=35,plotW=w-left-right,plotH=h-top-bottom,active=defs.filter(d=>enabled[d[0]]&&hist[d[0]].length);x.fillStyle='#171c1d';x.fillRect(0,0,w,h);if(!active.length){x.fillStyle='#9aa5a1';x.fillText('请选择至少一个通道',left,top+20);return}let all=active.flatMap(d=>hist[d[0]]),lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.08;lo-=pad;hi+=pad;x.strokeStyle='#52605f';x.fillStyle='#aab4b0';x.font='12px system-ui';for(let i=0;i<=5;i++){const y=top+plotH*i/5,val=hi-(hi-lo)*i/5;x.strokeStyle='#2d3939';x.beginPath();x.moveTo(left,y);x.lineTo(w-right,y);x.stroke();x.fillText(Number(val.toPrecision(5)),4,y+4)}x.save();x.translate(15,h/2);x.rotate(-Math.PI/2);x.fillStyle='#aab4b0';x.textAlign='center';x.fillText('数值（单位见图例）',0,0);x.restore();active.forEach(([key,,unit,color])=>{const a=hist[key];if(a.length<2)return;x.strokeStyle=color;x.lineWidth=1.7;x.beginPath();a.forEach((v,i)=>{const px=left+i/299*plotW,py=top+(hi-v)/(hi-lo)*plotH;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});x.fillStyle='#aab4b0';x.fillText('时间 →（最近 300 个采样点）',left,h-8)}addEventListener('resize',draw);draw();
</script></body></html>
